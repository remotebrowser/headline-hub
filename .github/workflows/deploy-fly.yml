# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo:
        description: Deploy headline-hub (demo)
        required: false
        type: boolean
        default: true
      lambda:
        description: Deploy headline-hub-lambda
        required: false
        type: boolean
        default: true
      daytona:
        description: Deploy headline-hub-daytona
        required: false
        type: boolean
        default: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.pm.outputs.matrix }}
    steps:
      - id: pm
        uses: remotebrowser/shared-github-actions/prepare-matrix@v1
        with:
          entries: |
            { "env": "demo",    "config": "demo",    "app_name": "headline-hub",         "fly_toml": "fly.toml"        }
            { "env": "lambda",  "config": "lambda",  "app_name": "headline-hub-lambda",  "fly_toml": "fly.lambda.toml" }
            { "env": "daytona", "config": "daytona", "app_name": "headline-hub-daytona", "fly_toml": "fly.toml" }
          selections: |
            ${{ inputs.demo    && 'demo'    || '' }}
            ${{ inputs.lambda  && 'lambda'  || '' }}
            ${{ inputs.daytona && 'daytona' || '' }}
          key-field: env

  deploy:
    needs: prepare-matrix
    name: Deploy ${{ matrix.app_name }}
    runs-on: ubuntu-22.04
    concurrency: deploy-${{ matrix.app_name }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: remotebrowser/shared-github-actions/deploy-fly@v1
        with:
          onepassword-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          fly-api-token: op://headline-hub/${{ matrix.config }}/FLY_API_TOKEN
          # Each Fly secret of the app that is not listed here is unset.
          onepassword-secrets: |
            ENVIRONMENT=op://headline-hub/${{ matrix.config }}/ENVIRONMENT
            LOGFIRE_TOKEN=op://headline-hub/${{ matrix.config }}/LOGFIRE_TOKEN
            REMOTEBROWSER_URL=op://headline-hub/${{ matrix.config }}/REMOTEBROWSER_URL
            SENTRY_DSN=op://headline-hub/${{ matrix.config }}/SENTRY_DSN
            ${{ matrix.config == 'lambda' && 'TAILSCALE_AUTHKEY=op://headline-hub/lambda/TAILSCALE_AUTHKEY' || '' }}
          app-name: ${{ matrix.app_name }}
          fly-toml: ${{ matrix.fly_toml }}
